name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-e2e:
    name: Studio browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: internal/studio/e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run Studio browser flow
        working-directory: internal/studio/e2e
        env:
          AM_STUDIO_E2E_CONFIG: ${{ runner.temp }}/am-studio-projects.json
        run: npm test

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      # mediaprobe / concat 的集成测试要真实的 ffmpeg 和 ffprobe。
      # 不装的话它们会自行跳过——测试仍然"通过"，但覆盖率会掉到门禁线以下，
      # 而且真正在跑外部命令的那部分代码就再没被验证过。
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - run: ffmpeg -version | head -1
      - run: go test -race ./...

  generated-assets:
    name: generated assets are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      # 只重跑文本产物。示例 PNG 在 -examples 开关后面，不参与这道门：
      # 不同版本的 rsvg-convert 输出字节不同，纳进来会让门随 runner 随机失败。
      - run: go generate ./internal/preset/
      - name: assets/presets 与 assets/styles 必须与画幅表、风格表一致
        run: git diff --exit-code

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Module tidiness
        run: go mod tidy && git diff --exit-code
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk '/total:/ { gsub("%", "", $3); if ($3 + 0 < 80) exit 1 }'
      - name: Cross-build release targets
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/am-${os}-${arch}" ./cmd/am
          done
