# ArticleToMotion 工具配置
# 取值优先级：环境变量 > .env > 本文件 > 内置默认
# 编排工具：codex | claude | qoder | codebuddy | opencode
ORCHESTRATOR=codex
# 渲染工具：codex | claude | qoder | codebuddy | opencode（可与 ORCHESTRATOR 相同）
RENDERER=claude
# TTS 工具：minimax | bailian | edge | elevenlabs | tencent | mlx（完整制作流程需要）
# mlx 仅限 Apple Silicon；edge 免鉴权但无服务承诺，适合预览
TTS_PROVIDER=minimax
# 已知文本强制对齐：auto | mlx | funasr
# auto 在 Apple Silicon 上用 mlx，其余平台用 funasr
ALIGN_PROVIDER=auto
# 镜头并发数：1-16，默认 3
SCENE_JOBS=3
